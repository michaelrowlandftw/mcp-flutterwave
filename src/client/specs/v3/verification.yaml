openapi: 3.0.3
info:
  title: Flutterwave Verification API
  description: >
    Integrity checks: bank account resolution and card BIN lookup. BVN tools
    were removed (Security review of DX-RFC-001, 2026-11-22).
  version: 1.0.0
servers:
  - url: https://api.flutterwave.com/v3
paths:

  /accounts/resolve:
    post:
      summary: Resolve a bank account number
      description: >
        Look up the account holder name for a bank account number.
        Use this to verify account details before initiating a transfer.
        Requires account_number (10 digits) and account_bank (bank code).
      operationId: resolveBankAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_number
                - account_bank
              properties:
                account_number:
                  type: string
                  description: 10-digit bank account number.
                  example: '0690000040'
                account_bank:
                  type: string
                  description: Bank code (3 digits). Use get_banks to look up codes.
                  example: '044'
      responses:
        '200':
          description: Account resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Account details fetched
                  data:
                    type: object
                    properties:
                      account_number:
                        type: string
                        example: '0690000040'
                      account_name:
                        type: string
                        example: Desola Ade
        '400':
          description: Account not found or invalid parameters.
        '401':
          description: Unauthorized.

  /card-bins/{bin}:
    get:
      summary: Verify a card BIN
      description: >
        Look up card metadata from the first 6 digits (BIN) of a card number.
        Returns issuer, card type (debit/credit), brand (Visa/Mastercard/AMEX),
        country of issue, and card subtype. Useful for validating cards before charging.
      operationId: verifyCardBin
      parameters:
        - name: bin
          in: path
          required: true
          schema:
            type: string
          description: First 6 digits of the card number (Bank Identification Number).
          example: '553188'
      responses:
        '200':
          description: Card BIN details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Bin found
                  data:
                    $ref: '#/components/schemas/CardBinData'
        '400':
          description: Invalid BIN.
        '401':
          description: Unauthorized.

components:
  schemas:

    CardBinData:
      type: object
      properties:
        issuing-country:
          type: string
          example: NG
        bin:
          type: string
          example: '553188'
        card-type:
          type: string
          example: CREDIT
        issuer-info:
          type: string
          example: NEXUS MERCHANT BANK DEBIT PERSONAL
        iso-country-alpha2:
          type: string
          example: NIGERIA
        brand:
          type: string
          example: MASTERCARD

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
