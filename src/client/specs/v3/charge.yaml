openapi: 3.0.3
info:
  title: Flutterwave Charge API
  description: API for charging customers by bank account, mobile money, USSD or M-Pesa, and charging cards saved from a 3DS checkout (tokenised charges). Direct card charges are not part of this server.
  version: 1.0.0
servers:
  - url: https://api.flutterwave.com/v3
paths:
  /charges:
    post:
      summary: Charge a payment method
      description: Directly charge a customer using the specified payment method type.
      operationId: createCharge
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - account
              - mobile_money_ghana
              - enaira
              - qr
              - mono
              - debit_uk_account
              - ach_payment
              - bank_transfer
              - mobile_money_tanzania
              - mobile_money_uganda
              - mobile_money_rwanda
              - mobile_money_zambia
              - mobile_money_francophone
              - mpesa
              - ussd
              - capitec
              - fawry_pay
              - opay
              - voucher_payment
          description: The payment method type to charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_ref:
                  type: string
                  example: 'MC-158523s09v5050e8'
                amount:
                  type: string
                  example: '100'
                currency:
                  type: string
                  example: 'NGN'
                email:
                  type: string
                  example: 'user@example.com'
                fullname:
                  type: string
                  example: 'Yemi Desola'
                phone_number:
                  type: string
                  example: '09000000000'
                redirect_url:
                  type: string
                  example: 'https://example.com/callback'
                account_bank:
                  type: string
                  example: '044'
                account_number:
                  type: string
                  example: '0690000031'
                network:
                  type: string
                  example: 'MTN'
      responses:
        '200':
          description: Charge initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '400':
          description: Bad request, invalid data.
        '401':
          description: Unauthorized, invalid API key.
  /tokenized-charges:
    post:
      summary: Charge a saved card by token
      description: >-
        Charge a card saved from an earlier 3DS checkout payment, using the token from that
        payment (data.card.token). Request fields as measured in Test Mode (candidate V3 spec,
        0.1.0-candidate+20261122); the docs list token, currency, amount, email and tx_ref.
        Required flags are not measured yet. By default the charge runs 3DS and answers with a
        redirect, so the customer must be present (Michael, 2026-11-22; to verify).
      operationId: createTokenizedCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: 'flw-t1nf-c25d14a3a6b5afaf8022fe88212a3eaa-k3n'
                currency:
                  type: string
                  example: 'NGN'
                country:
                  type: string
                  example: 'NG'
                amount:
                  type: number
                  example: 100
                email:
                  type: string
                  example: 'user@example.com'
                tx_ref:
                  type: string
                  example: 'MC-158523s09v5050e8'
                narration:
                  type: string
                redirect_url:
                  type: string
                  example: 'https://example.com/callback'
              required:
                - token
                - currency
                - amount
                - email
                - tx_ref
      responses:
        '200':
          description: Charge initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '400':
          description: Bad request, invalid data.
        '401':
          description: Unauthorized, invalid API key.
  /validate-charge:
    post:
      summary: Validate a charge with OTP
      description: Validate a pending charge that requires OTP authorisation (card, account, or USSD).
      operationId: validateCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
                  example: '12345'
                flw_ref:
                  type: string
                  example: 'FLW-MOCK-1e9e0e0e0e0e0e0e'
                type:
                  type: string
                  example: 'card'
              required:
                - otp
                - flw_ref
      responses:
        '200':
          description: Charge validated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
components:
  schemas:
    ChargeResponse:
      type: object
      properties:
        status:
          type: string
          example: 'success'
        message:
          type: string
          example: 'Charge initiated'
        data:
          type: object
          properties:
            id:
              type: integer
              example: 4975363
            tx_ref:
              type: string
              example: 'MC-158523s09v5050e8'
            flw_ref:
              type: string
              example: 'FLW-MOCK-1e9e0e0e0e0e0e0e'
            status:
              type: string
              example: 'pending'
            amount:
              type: number
              example: 100
            currency:
              type: string
              example: 'NGN'
            charge_type:
              type: string
              example: 'normal'
            auth_model:
              type: string
              description: Auth model used by the card (e.g. PIN, VBVSECURECODE)
              example: 'PIN'
            processor_response:
              type: string
              example: 'Approved'
        meta:
          type: object
          description: Present when further authorization steps are required.
          properties:
            authorization:
              type: object
              properties:
                mode:
                  type: string
                  enum: [pin, avs_noauth, otp, redirect]
                  description: The next required action.
                fields:
                  type: array
                  items:
                    type: string
                  description: Fields needed from the customer (PIN or AVS flows).
                redirect:
                  type: string
                  description: Redirect URL for 3DS authentication.
                endpoint:
                  type: string
                  description: Endpoint for OTP validation.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
