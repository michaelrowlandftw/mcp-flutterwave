name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install -g npm@11.6.2 && npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build project
        run: npm run build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          # Update server.json version to match package.json
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v' server.json > tmp && mv tmp server.json
          git add package.json package-lock.json server.json
          git commit -m "chore: bump version to $VERSION"
          git push

      - name: Create tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Update server.json version on release
        if: github.event_name == 'release'
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          jq --arg v "$VERSION" '.version = $v' server.json > tmp && mv tmp server.json
          jq --arg v "$VERSION" '.packages[0].version = $v' server.json > tmp && mv tmp server.json

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            Release notes for version ${{ steps.version.outputs.version }}
            
            ## Changes
            - Updated MCP Flutterwave integration
            
            ## Installation
            ```bash
            npm install -g mcp-flutterwave
            ```
            
            ## Usage with Claude Desktop
            ```json
            {
              "mcpServers": {
                "flutterwave": {
                  "command": "mcp-flutterwave",
                  "args": ["--tools=all"],
                  "env": {
                    "FLW_SECRET_KEY": "YOUR_SECRET_KEY",
                    "FLW_ENCRYPTION_KEY": "YOUR_ENCRYPTION_KEY"
                  }
                }
              }
            }
            ```
          draft: false
          prerelease: false

      # Pinned version and checksum (security review L6). To upgrade, take the
      # value for mcp-publisher_linux_amd64.tar.gz from registry_<version>_checksums.txt.
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Get OIDC token for MCP Registry
        id: oidc
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const token = await core.getIDToken('https://registry.modelcontextprotocol.io')
            core.setSecret(token)
            core.exportVariable('MCP_OIDC_TOKEN', token)

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.MCP_OIDC_TOKEN }}

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
