name: Publish Package

# Releases start from a published GitHub release (tag vX.Y.Z) made after a
# version-bump pull request; nothing here pushes to main, so branch protection holds.
# npm publishing uses trusted publishing (OIDC): no NPM_TOKEN secret exists. Set up on
# npmjs.com: package settings, Trusted publishers, GitHub Actions, this repository,
# workflow publish.yml (see docs/release.md).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and MCP Registry login
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install -g npm@11.6.2 && npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build project
        run: npm run build

      - name: Update server.json version on release
        if: github.event_name == 'release'
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          jq --arg v "$VERSION" '.version = $v' server.json > tmp && mv tmp server.json
          jq --arg v "$VERSION" '.packages[0].version = $v' server.json > tmp && mv tmp server.json

      # Trusted publishing (OIDC) needs npm 11.5.1 or later (installed above) and
      # id-token: write. npm adds provenance automatically; no token is used.
      - name: Publish to npm
        run: npm publish --access public

      # Pinned version and checksum (security review L6). To upgrade, take the
      # value for mcp-publisher_linux_amd64.tar.gz from registry_<version>_checksums.txt.
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Get OIDC token for MCP Registry
        id: oidc
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const token = await core.getIDToken('https://registry.modelcontextprotocol.io')
            core.setSecret(token)
            core.exportVariable('MCP_OIDC_TOKEN', token)

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.MCP_OIDC_TOKEN }}

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
